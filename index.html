<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>
<body>
    <script>
        class Student {
            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades;
                this.attendance = attendance;
            }

            calculateAverage() {
                const total = this.grades.reduce((acc, grade) => acc + grade, 0);
                return Number((total / this.grades.length).toFixed(2));
            }

            getGrade(average = this.calculateAverage()) {
                if (average >= 90) {
                    return 'A';
                } else if (average >= 80) {
                    return 'B';
                } else if (average >= 70) {
                    return 'C';
                } else if (average >= 60) {
                    return 'D';
                } else if (average >= 50) {
                    return 'E';
                } else {
                    return 'F';
                }
            }

            getFinalStatus() {
                const average = this.calculateAverage();
                if (average >= 50 && this.attendance >= 75) {
                    return "ناجح";
                } else {
                    return "يحتاج مراجعة";
                }
            }
        }

        const studentsList = [
            new Student(101, "Ahmed", [95, 92, 98], 95),
            new Student(102, "Sara", [88, 90, 92], 90), // درجات عالية لسارة
            new Student(103, "John", [42, 45, 48], 80),  // متعثر
            new Student(104, "Emma", [40, 48, 44], 78)   // متعثر
        ];

        const strugglingStudents = studentsList.filter(student => {
            const avg = student.calculateAverage();
            return avg >= 40 && avg <= 49;
        });

        const gracedStudents = strugglingStudents.map(student => {
            const originalAvg = student.calculateAverage();
            const adjustedAvg = Number((originalAvg + 5).toFixed(2));

            return {
                id: student.id,
                name: student.name,
                attendance: `${student.attendance}%`, // تم تصحيح العلامات هنا
                originalAverage: originalAvg,
                adjustedAverage: adjustedAvg,
                newGrade: student.getGrade(adjustedAvg),
                newStatus: (adjustedAvg >= 50 && student.attendance >= 75)
                    ? "ناجح" : "يحتاج مراجعة"
            };
        });

        const totalAdjustedAverages = gracedStudents.reduce((sum, student) => {
            return sum + student.adjustedAverage;
        }, 0);

        const overallGracedAverage = gracedStudents.length > 0
            ? Number((totalAdjustedAverages / gracedStudents.length).toFixed(2))
            : 0;

        studentsList.forEach(student => {
            const avg = student.calculateAverage();
            const grade = student.getGrade(avg);
            const status = student.getFinalStatus();

            console.log(`Name: ${student.name} | Average: ${avg} | Grade: ${grade} | Status: ${status}`); // تم تصحيح العلامات هنا
        });

        console.log("Struggling Students After Adjustment:", gracedStudents);

        console.log(`متوسط درجات الطلاب المتعثرين بعد التعديل: ${overallGracedAverage}`); // تم تصحيح العلامات هنا
    </script>
</body>
</html>
